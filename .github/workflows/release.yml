name: SunoDM Release Validation

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunodm-release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Release / Candidate Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare release evidence directory
        run: mkdir -p .dist/sbom
      - name: Generate SPDX dependency SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: sunodm-${{ github.sha }}.spdx.json
          output-file: .dist/sbom/sunodm-${{ github.sha }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Rust 1.97.1 with WASI target
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy --target wasm32-wasip1
          rustup default 1.97.1
      - name: Install verification dependencies
        run: python tools/control.py install --skip-backend --skip-playwright
      - name: Install Playwright Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Install Tauri system dependencies
        run: python tools/control.py tauri install --skip-rust --skip-node --skip-frontend
      - name: Verify the pinned Rust WASI analyzer build
        run: python tools/quality/rust_analyzer/build.py --check
      - name: Run code quality and architecture gate
        run: python tools/control.py quality --release
      - name: Run documentation maintenance tests
        run: |
          python tools/control.py docs check
          tools/.venv/bin/python -m pytest -q tools/tests/test_docs_index.py
      - name: Start the local frontend
        run: python tools/control.py run --detach
      - name: Run release-independent tests
        run: python tools/control.py test --suite all
      - name: Stop the local frontend
        if: always()
        run: python tools/control.py stop
      - name: Build web validation artifact
        run: python tools/control.py build web
      - name: Run release gate
        run: python tools/control.py release check
      - name: Upload web validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sunodm-web-release-validation
          if-no-files-found: error
          retention-days: 14
          path: |
            .dist/web/*.zip
            .dist/sbom/*.spdx.json

  desktop-candidates:
    name: Release / Desktop Candidates
    needs: validate
    uses: ./.github/workflows/desktop.yml
    with:
      linux_bundles: "deb,rpm,appimage"
