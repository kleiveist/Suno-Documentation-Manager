name: SunoDM Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      linux_bundles:
        description: Comma-separated unsigned Linux bundle targets
        required: false
        default: deb
        type: string
  workflow_call:
    inputs:
      linux_bundles:
        description: Comma-separated unsigned Linux bundle targets
        required: false
        default: deb
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-build:
    name: Desktop / ${{ matrix.label }} / Unsigned Verification
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            target: linux
            bundles: deb
            archive: sunodm-desktop-linux-unsigned.tar.gz
          - label: macOS
            os: macos-latest
            target: macos
            bundles: all
            archive: sunodm-desktop-macos-unsigned.tar.gz
          - label: Windows
            os: windows-latest
            target: windows
            bundles: all
            archive: sunodm-desktop-windows-unsigned.zip
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Rust 1.97.1
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-
            ${{ runner.os }}-cargo-
      - name: Install portable tooling runtime
        run: python tools/control.py install --skip-backend --skip-frontend --skip-playwright
      - name: Verify Windows batch launcher execution
        if: matrix.target == 'windows'
        run: tools\.venv\Scripts\python.exe -m pytest -q tools/tests/test_process.py
      - name: Install frontend dependencies
        run: python tools/control.py install --skip-backend --skip-tooling --skip-playwright
      - name: Install native Tauri prerequisites
        run: python tools/control.py tauri install --skip-rust --skip-node --skip-frontend
      - name: Verify the portable Rust analyzer runtime
        run: python tools/control.py doctor
      - name: Verify UTF-8 Rust analyzer transport
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            TOOLING_PYTHON="tools/.venv/Scripts/python.exe"
          else
            TOOLING_PYTHON="tools/.venv/bin/python"
          fi
          "$TOOLING_PYTHON" -m pytest -q \
            tools/tests/quality/test_rust_syntax.py::test_subprocess_transport_is_utf8_when_child_text_stdio_is_cp1252
      - name: Run Tauri and Rust doctor
        run: python tools/control.py tauri doctor
      - name: Run Tauri and Rust tests
        run: python tools/control.py test --suite tauri
      - name: Build unsigned native package
        if: matrix.target != 'linux'
        run: python tools/control.py build desktop --target ${{ matrix.target }}
      - name: Build unsigned Linux packages
        if: matrix.target == 'linux'
        env:
          LINUX_BUNDLES: ${{ inputs.linux_bundles || matrix.bundles }}
        run: python tools/control.py build desktop --target linux --bundles "$LINUX_BUNDLES"
      - name: Verify unsigned Linux packages
        if: matrix.target == 'linux'
        env:
          LINUX_BUNDLES: ${{ inputs.linux_bundles || matrix.bundles }}
        run: |
          python tools/control.py tauri verify-artifacts \
            --target linux \
            --bundles "$LINUX_BUNDLES" \
            --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Archive unsigned POSIX verification artifacts
        if: matrix.target != 'windows'
        shell: bash
        env:
          ARCHIVE_NAME: ${{ matrix.archive }}
          DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive_root=".dist/desktop/artifacts"
          archive_path="$archive_root/$ARCHIVE_NAME"
          bundle_root="src-tauri/target/release/bundle"
          archive_inputs=("$bundle_root")

          test -d "$bundle_root"
          test ! -L "$bundle_root"
          if [[ "$DESKTOP_TARGET" == "linux" ]]; then
            archive_inputs+=(
              ".dist/desktop/linux/linux-bundles.json"
              ".dist/desktop/linux/SHA256SUMS"
            )
          fi
          for archive_input in "${archive_inputs[@]}"; do
            test -e "$archive_input"
            test ! -L "$archive_input"
          done

          mkdir -p "$archive_root"
          test ! -e "$archive_path"
          tar --create --gzip --file "$archive_path" -- "${archive_inputs[@]}"
          test -s "$archive_path"
          tar --list --gzip --file "$archive_path" >/dev/null
      - name: Archive unsigned Windows verification artifacts
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          ARCHIVE_NAME: ${{ matrix.archive }}
        run: |
          $ErrorActionPreference = "Stop"
          $archiveRoot = ".dist/desktop/artifacts"
          $archivePath = Join-Path $archiveRoot $env:ARCHIVE_NAME
          $bundleRoot = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"

          if (-not (Test-Path -LiteralPath $bundleRoot -PathType Container)) {
            throw "Windows bundle directory is missing: $bundleRoot"
          }
          $reparsePoint = Get-ChildItem -LiteralPath $bundleRoot -Force -Recurse |
            Where-Object { ($_.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0 } |
            Select-Object -First 1
          if ($null -ne $reparsePoint) {
            throw "Windows bundle directory contains an unsafe reparse point: $($reparsePoint.FullName)"
          }
          $candidate = Get-ChildItem -LiteralPath $bundleRoot -File -Recurse | Select-Object -First 1
          if ($null -eq $candidate) {
            throw "Windows bundle directory contains no files: $bundleRoot"
          }

          New-Item -ItemType Directory -Path $archiveRoot -Force | Out-Null
          if (Test-Path -LiteralPath $archivePath) {
            throw "Refusing to overwrite an existing desktop archive: $archivePath"
          }
          Compress-Archive -LiteralPath $bundleRoot -DestinationPath $archivePath -CompressionLevel Optimal
          if (
            -not (Test-Path -LiteralPath $archivePath -PathType Leaf) -or
            (Get-Item -LiteralPath $archivePath).Length -le 0
          ) {
            throw "Windows desktop archive is missing or empty: $archivePath"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $resolvedArchivePath = (Resolve-Path -LiteralPath $archivePath).Path
          $archive = [System.IO.Compression.ZipFile]::OpenRead($resolvedArchivePath)
          try {
            if ($archive.Entries.Count -eq 0) {
              throw "Windows desktop archive contains no entries: $archivePath"
            }
          } finally {
            $archive.Dispose()
          }
      - name: Upload unsigned verification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sunodm-desktop-${{ matrix.target }}-unsigned
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
          path: .dist/desktop/artifacts/${{ matrix.archive }}
      - name: Verify repository files are unchanged
        shell: bash
        run: git diff --exit-code
