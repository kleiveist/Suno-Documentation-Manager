version: 2

# Keep routine maintenance compact without hiding breaking changes. Each
# ecosystem gets one grouped minor/patch PR, while majors remain individual.
# Ecosystems with SemVer cooldown support receive a 30-day major-update review
# buffer. Security updates remain independent.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "05:10"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    cooldown:
      semver-major-days: 30
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: "/tools"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    cooldown:
      semver-major-days: 30
    groups:
      tooling-python-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "05:40"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    cooldown:
      semver-major-days: 30
    groups:
      tauri-rust-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: "/tools/quality/rust_analyzer"
    schedule:
      interval: weekly
      day: monday
      time: "05:50"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    cooldown:
      semver-major-days: 30
    groups:
      analyzer-rust-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
