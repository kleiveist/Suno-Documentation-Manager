schema_version = 1
id = "suno-track"
version = "1.8"
name = "Suno Track Documentation"
blocker_statuses = ["FAIL", "BLOCKED", "NOT_VERIFIED"]

[[steps]]
id = "track"
order = 1
name = "01 Track"
required = true
when = "always"
description = "Track identity, dates, commercial intent, and workflow snapshot."

[[steps]]
id = "source"
order = 2
name = "02 Source"
required = true
when = "always"
description = "Guided external, own, code-based, and third-party source declarations with conditional evidence."

[[steps]]
id = "suno"
order = 3
name = "03 Suno"
required = true
when = "always"
description = "Suno model, project, plan, export, and project evidence."

[[steps]]
id = "human_work"
order = 4
name = "04 Human Work"
required = true
when = "always"
description = "Instrumental and vocal status, Suno lyrics/structure field content, style prompt, and confirmed human editing work."

[[steps]]
id = "artwork"
order = 5
name = "05 Artwork"
required = true
when = "always"
description = "Artwork origin, actual production stages, evidence, and conditional content checks."

[[steps]]
id = "ai_transparency"
order = 6
name = "06 AI Transparency"
required = true
when = "always"
description = "Audio AI transparency plus the existing artwork transparency and disclosure checks."

[[steps]]
id = "release"
order = 7
name = "07 Release"
required = true
when = "always"
description = "Final release audio, local Chromaprint fingerprinting, selected release notes, and the documented last-editing decision."

[[steps]]
id = "evidence_licenses"
order = 8
name = "08 Evidence & Licenses"
required = true
when = "always"
description = "Required evidence coverage and portable copies of selected license or subscription evidence."

[[steps]]
id = "integrity"
order = 9
name = "09 Integrity"
required = true
when = "always"
description = "Current generated documents plus complete native SHA-256 generation and verification."

[[steps]]
id = "finalize"
order = 10
name = "10 Finalize"
required = true
when = "always"
description = "Final blocking-deviation check and native certificate transaction."

