[package]
name = "sunodm"
version = "0.1.0"
description = "Offline-first Suno track documentation manager"
authors = ["Suno Documentation Manager Contributors"]
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
font8x8 = "0.3"
hmac = "0.12"
printpdf = { version = "=0.12.5", default-features = false }
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
walkdir = "2"
